    genome_sequence_file_md5: 4e004c5032ade9aa37cc795890051f7c

    # Genomic fetures
    genomic_feature_file: /home/zzhang/Documents/projects/wp_vasaseq/inputs/reference/genome/gencode.vM29lift38.annotation.gtf
    genomic_feature_file_md5: 617ab0c95cd531e86608b056d5726455
