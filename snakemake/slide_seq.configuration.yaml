    erna_feature_file_md5: eadeb57c7c02a72d81a46e1087bd0e97

    # Reference
    gedi_index_dir: /home/zzhang/Documents/projects/wp_vasaseq/inputs/reference/genome/GEDI_GRCm38
    star_index_dir: /home/zzhang/Documents/projects/resources/references/GRCm38.celatlas_spatial

    # Required outputs, will be process by RuleIO class.
    required_outputs:
        - normalize_fastq_name
        - quality_control
        - alignment
        - spatial
        - alignment_reports
        - nascent_rna
        - nascent_rna_per_treatment
        # - quantification_erna
        # - publication

    # Slide-seq specific parameters
    bin_size: 20
    chemistry: BBV2.4
    chemistry_pattern: C4L15C4L15C4U10T18
    insert_size: 150
    feature_type: gene
    expected_cell_num: 3000
    pixel_size: 0.24
    segment_method: gene_expr
    model_file: /opt/tools/database/celatlas_spatial/1.5.0/swin_tiny.pth # A path in the container
    model_file_md5: f8530c9b30a0451d41a4d4b46c75f241

